name: Manual deploy prod-storage-imgbed Pages

# push 自动部署由 Cloudflare Pages Git 集成完成(2026-11-15 已验证生效)。
# 本 workflow 仅作为手动补部署通道(workflow_dispatch),避免与 Git 集成双重部署。
# Cloudflare Pages 项目真实名称: prod-storage-imgbed
# secret 用 CLOUDFLARE_API_TOKEN_PAGES,避免触发上游 deploy-worker.yml

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy frontend-dist --project-name=prod-storage-imgbed --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
