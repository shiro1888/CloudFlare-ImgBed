name: Deploy imgbed-git Pages

# 说明: 仓库自带的 deploy-worker.yml 因未配置 CLOUDFLARE_API_TOKEN 而一直跳过(空转);
# 真实线上是 Pages 项目 imgbed-git(含 functions/),本 workflow 负责它的自动部署。
# 故意不设置名为 CLOUDFLARE_API_TOKEN 的 secret,避免触发上游 Worker 部署产生重复项目。

on:
  push:
    branches: [main]
    paths:
      - 'frontend-dist/**'
      - 'functions/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy frontend-dist --project-name=imgbed-git --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PAGES }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
